name: fasberry-dev

services:
  nats:
    image: nats:2.12
    container_name: nats-1-dev
    restart: unless-stopped
    ports:
      - ${NATS_EXTERNAL_PORT}:4222
      - "8224:8222"
    command:
      - "-js"
      - "-sd=2G"
      - "--sd=/nats/jetstream"
      - "--T"
      - "-VV"
      - "--user=${NATS_USER}"
      - "--pass=${NATS_PASSWORD}"
      - "--addr=0.0.0.0"
    environment:
      - NATS_USER=${NATS_USER}
      - NATS_PASSWORD=${NATS_PASSWORD}
    volumes:
      - ./data/nats/data:/nats
      - ./data/nats/jetstream:/nats/jetstream
    networks:
      - fasberry

  dragonfly:
    image: 'docker.dragonflydb.io/dragonflydb/dragonfly'
    container_name: dragonfly-dev
    environment:
       - REDIS_USER_NAME=${REDIS_USER_NAME}
       - REDIS_USER_PASSWORD=${REDIS_PASSWORD}
    ulimits:
      memlock: -1
    ports:
      - ${DRAGONFLY_EXTERNAL_PORT}:6379
    # For better performance, consider `host` mode instead `port` to avoid docker NAT.
    # `host` mode is NOT currently supported in Swarm Mode.
    # https://docs.docker.com/compose/compose-file/compose-file-v3/#network_mode
    # network_mode: "host"
    volumes:
      - ./data/dragonfly/data:/data
      - ./scripts/dragonfly/init.sh:/usr/local/bin/init.sh
    command: ["/usr/local/bin/init.sh"]

  bisquite-db:
    image: mariadb:11.8
    container_name: bisquite-db-dev
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MARIADB_DATABASE: bisquite
      MARIADB_USER: ${MYSQL_USER}
      MARIADB_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - ${BISQUITE_DB_EXTERNAL_PORT}:3306/tcp
    volumes:
      - ./data/db/minecraft/bisquite/data:/var/lib/mysql
      - ./data/db/minecraft/bisquite/custom.cnf:/etc/mysql/conf.d/custom.cnf:ro
    networks:
      - fasberry
    healthcheck:
      test: ["CMD", "mariadb", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}", "-e", "SELECT 1;"]
      start_period: 10s
      interval: 10s
      timeout: 5s
      retries: 3

  luckperms-db:
    image: postgres:15.1
    container_name: luckperms-db-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${LUCKPERMS_POSTGRES_USER}
      POSTGRES_PASSWORD: ${LUCKPERMS_POSTGRES_PASSWORD}
      POSTGRES_DB: ${LUCKPERMS_POSTGRES_DB}
    ports:
      - ${LUCKPERMS_DB_EXTERNAL_PORT}:5432/tcp
    volumes:
      - ./data/db/minecraft/luckperms/data:/var/lib/postgresql/data
    networks:
      - fasberry
    healthcheck:
      test: ["CMD", "true"]
      start_period: 10s
      interval: 10s
      timeout: 5s
      retries: 3
      
  general-db:
    image: postgres:18
    container_name: general-db-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${GENERAL_POSTGRES_USER}
      POSTGRES_PASSWORD: ${GENERAL_POSTGRES_PASSWORD}
      POSTGRES_DB: ${GENERAL_POSTGRES_DB}
    ports:
      - ${GENERAL_DB_EXTERNAL_PORT}:5432/tcp
    volumes:
      - ./data/db/main/data:/var/lib/postgresql/18/docker
    networks:
      - fasberry
    healthcheck:
      test: ["CMD", "true"]
      start_period: 10s
      interval: 10s
      timeout: 5s
      retries: 3

  eco-db:
    image: mysql:9.2
    container_name: eco-db-dev
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: eco
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - ${ECO_DB_EXTERNAL_PORT}:3306/tcp
    volumes:
      - ./data/db/minecraft/eco/data:/var/lib/mysql

  shared-db:
    image: mariadb:11.8
    container_name: shared-db-dev
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MARIADB_DATABASE: skins_proxy
      MARIADB_USER: ${MYSQL_USER}
      MARIADB_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - ${SHARED_DB_EXTERNAL_PORT}:3306/tcp
    volumes:
      - ./data/db/minecraft/skins_proxy/data:/var/lib/mysql
    networks:
      - fasberry
    healthcheck:
      test: ["CMD", "mariadb", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}", "-e", "SELECT 1;"]
      start_period: 10s
      interval: 10s
      timeout: 5s
      retries: 3

networks:
  fasberry:
    name: fasberry