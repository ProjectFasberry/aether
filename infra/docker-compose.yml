name: fasberry-infra

services:
  cap-standalone: 
    image: tiago2/cap:latest
    container_name: cap-standalone
    restart: unless-stopped
    ports:
      - "3002:3000"
    environment:
      ADMIN_KEY: ${CAP_PASSWORD}
    volumes:
      - ./data/cap:/usr/src/app/.data

  registry:
    image: ghcr.io/project-zot/zot-linux-amd64:latest
    container_name: registry
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - ./data/registry:/var/lib/zot
      - ./data/registry/config.json:/etc/zot/config.json:ro
      - ./data/registry/htpasswd:/etc/zot/htpasswd:ro
    networks:
      - fasberry
      
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER}      
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD}
    volumes:
      - ./data/minio/data:/data
    command: server /data --console-address ":9001"
    networks:
      - fasberry
      
