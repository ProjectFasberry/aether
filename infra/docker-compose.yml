name: fasberry-infra

x-logging: &loki-logging
  driver: fluentd
  options:
    fluentd-address: "localhost:24224"
    tag: "docker.{{.Name}}"
    mode: non-blocking
    max-buffer-size: 4m

services:
  cap-standalone:
    image: tiago2/cap:latest
    container_name: cap-standalone
    restart: unless-stopped
    ports:
      - "3002:3000"
    environment:
      ADMIN_KEY: ${CAP_PASSWORD}
    volumes:
      - ./data/cap:/usr/src/app/.data
    # logging: *loki-logging
    # depends_on:
