name: fasberry-infra-dev

services:
  traefik:
    image: traefik:v3.6
    restart: unless-stopped
    env_file: 
      - .env.traefik
    ports:
      - "80:80"
      - "443:443"
      - "25565:25565"
    command:
      - "--log.level=DEBUG"
      - "--log.format=common"
      - "--api.dashboard=true"
      - "--api.debug=true"
      - "--accesslog=true"
      - "--accesslog.bufferingsize=100"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.web.http.redirections.entrypoint.permanent=true"
      - "--entrypoints.web.observability.accesslogs=false"
      - "--entrypoints.web.observability.metrics=false"
      - "--entrypoints.web.observability.tracing=false"
      - "--entrypoints.websecure.address=:443"
      # - "--entrypoints.minecraft.address=:25565"
      - "--experimental.plugins.redirecterrors.modulename=github.com/indivisible/redirecterrors"
      - "--experimental.plugins.redirecterrors.version=v0.1.0"
      - "--certificatesresolvers.myresolver.acme.email=${RESOLVER_EMAIL}"
      - "--certificatesresolvers.myresolver.acme.storage=acme.json"
      - "--providers.redis.rootKey=traefik:"
      - "--providers.redis.endpoints=${REDIS_HOST}:6379"
      - "--providers.redis.username=${REDIS_USER}"
      - "--providers.redis.password=${REDIS_PASSWORD}"
      - "--tracing=true"
      - "--tracing.otlp.grpc=true"
      - "--tracing.otlp.grpc.endpoint=jaeger:4317"
      - "--tracing.otlp.grpc.insecure=true"
      - "--tracing.servicename=traefik"
    volumes:
      - ./config/traefik/certs:/etc/traefik/certs
      - ./config/traefik/logs:/etc/traefik/logs
    # network_mode: host
    networks:
      - web

  jaeger:
    image: jaegertracing/all-in-one:1.55
    ports:
      - "16686:16686" 
      - "4317:4317"
      - "4318:4318"
    networks:
      - web

networks:
  web:
    external: true