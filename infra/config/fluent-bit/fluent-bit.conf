[SERVICE]
    Flush        1
    Daemon       Off
    Parsers_File parsers.conf

[INPUT]
    Name         forward
    Listen       0.0.0.0
    Port         24224

[OUTPUT]
    Name         loki
    Match        *
    Host         loki
    Port         3100
    Labels       job=docker, container=$container_name
    Auto_Kubernetes_Labels off