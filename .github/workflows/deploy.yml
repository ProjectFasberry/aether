name: Deploy landing to vercel
on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VITE_LANDING_ENDPOINT: https://fasberry.fun
      PUBLIC_ENV__TG_NAME: fasberry
      VITE_APP_URL: https://app.fasberry.fun
      VITE_MAIN_DOMAIN: fasberry.fun
      PUBLIC_ENV__API_URL: https://api.fasberry.fun
      VITE_VOLUME_URL: https://volume.fasberry.fun
      
    steps:
      - uses: actions/checkout@v4

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install deps
        run: bun install --force

      - name: Build app
        run: bun run --cwd apps/landing build

      - name: Build vercel output
        run: bunx vercel build --token ${{ secrets.VERCEL_TOKEN }} --cwd apps/landing
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy to vercel
        run: bunx vercel deploy --prebuilt --prod --token ${{ secrets.VERCEL_TOKEN }} --cwd apps/landing
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}