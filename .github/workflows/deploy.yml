name: Deploy landing to vercel
on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VITE_LANDING_ENDPOINT: https://fasberry.fun
      PUBLIC_ENV__TG_NAME: fasberry
      VITE_APP_URL: https://app.fasberry.fun
      VITE_MAIN_DOMAIN: fasberry.fun
      PUBLIC_ENV__API_URL: https://api.fasberry.fun
      VITE_VOLUME_URL: https://volume.fasberry.fun
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --force
      
      - name: Pull Vercel Project Settings
        run: bunx vercel pull --yes --environment=production --token ${{ secrets.VERCEL_TOKEN }} --cwd apps/landing

      - name: Build Vercel Artifacts
        run: bunx vercel build --prod --token ${{ secrets.VERCEL_TOKEN }} --cwd apps/landing

      - name: Deploy to Vercel
        run: bunx vercel deploy --prebuilt --prod --token ${{ secrets.VERCEL_TOKEN }} --cwd apps/landing