name: Build thunderbird

on:
  push:
    branches: [main, dev]
    paths:
      - "apps/thunderbird/**"
      - "pkgs/**"
      - "bun.lock"
      - "package.json"
      - "bunfig.toml"
      - ".github/workflows/build-thunderbird.yml"
  workflow_dispatch:
    inputs:
      stage:
        description: Image stage
        type: choice
        options: [prod, staging]
        default: prod

concurrency:
  group: aether-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: [self-hosted, linux, x64, fasberry]
    permissions:
      contents: read
    env:
      STAGE: ${{ github.event_name == 'workflow_dispatch' && inputs.stage || (github.ref_name == 'main' && 'prod' || 'staging') }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ vars.REGISTRY_HOST || 'registry.fasberry.fun' }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
          logout: false

      # The deploy host pulls :latest on a timer (ProjectFasberry/infra,
      # scripts/pull-update.sh), so pushing here is the whole rollout.
      - uses: docker/build-push-action@v6
        with:
          builder: fasberry
          context: .
          file: apps/thunderbird/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            STAGE=${{ env.STAGE }}
          secrets: |
            npm_token=${{ secrets.NODE_AUTH_TOKEN }}
          tags: |
            ${{ vars.REGISTRY_HOST || 'registry.fasberry.fun' }}/${{ env.STAGE }}/thunderbird:latest
            ${{ vars.REGISTRY_HOST || 'registry.fasberry.fun' }}/${{ env.STAGE }}/thunderbird:sha-${{ github.sha }}
          cache-from: type=registry,ref=${{ vars.REGISTRY_HOST || 'registry.fasberry.fun' }}/${{ env.STAGE }}/thunderbird:buildcache
          cache-to: type=registry,ref=${{ vars.REGISTRY_HOST || 'registry.fasberry.fun' }}/${{ env.STAGE }}/thunderbird:buildcache,mode=max
