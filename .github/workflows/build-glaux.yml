name: Build glaux

on:
  push:
    branches: [main, dev, staging]
    paths:
      - "apps/glaux/**"
      - "pkgs/**"
      - "bun.lock"
      - "package.json"
      - "bunfig.toml"
      - ".github/workflows/build-glaux.yml"
  workflow_dispatch:
    inputs:
      stage:
        description: Image stage
        type: choice
        options: [prod, staging, dev]
        default: prod

concurrency:
  group: aether-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: [self-hosted, linux, x64, fasberry]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Resolve stage
        id: stage
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            stage="${{ inputs.stage }}"
          else
            case "${{ github.ref_name }}" in
              main) stage=prod ;;
              staging) stage=staging ;;
              *) stage=dev ;;
            esac
          fi
          echo "stage=$stage" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: registry.fasberry.fun
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
          logout: false

      # Rollout is manual: publish the image, then run `fasberry deploy`
      # (or use Portainer) on the host.
      - uses: docker/build-push-action@v6
        with:
          builder: fasberry
          context: .
          file: apps/glaux/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            STAGE=${{ steps.stage.outputs.stage }}
          tags: |
            registry.fasberry.fun/${{ steps.stage.outputs.stage }}/glaux:latest
            registry.fasberry.fun/${{ steps.stage.outputs.stage }}/glaux:sha-${{ github.sha }}
          cache-from: type=gha,scope=glaux
          cache-to: type=gha,mode=max,scope=glaux

      - name: Notify glaux (Telegram + Gotify) about the pushed image
        continue-on-error: true
        env:
          ALERT_URL: ${{ vars.ALERT_URL || 'https://panel.fasberry.fun/internal/alerts' }}
          ALERT_KEY: ${{ secrets.ALERT_KEY }}
          STAGE: ${{ steps.stage.outputs.stage }}
          APP: glaux
        run: |
          [ -n "$ALERT_KEY" ] || { echo "ALERT_KEY is not set; skipping"; exit 0; }
          TITLE="image pushed: ${STAGE}/${APP}"
          MESSAGE=$(printf 'image: %s/%s:latest\ncommit: %s\nby: %s\nrun: https://github.com/%s/actions/runs/%s' \
            "$STAGE" "$APP" "${GITHUB_SHA:0:7}" "$GITHUB_ACTOR" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")
          payload=$(python3 -c 'import json,sys; print(json.dumps({"from":"ci","title":sys.argv[1],"message":sys.argv[2],"severity":"info"}))' "$TITLE" "$MESSAGE")
          curl -fsS -X POST "$ALERT_URL" \
            -H "Authorization: Bearer $ALERT_KEY" \
            -H "content-type: application/json" \
            --data "$payload"
