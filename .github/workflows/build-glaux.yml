name: Build glaux

on:
  push:
    branches: [main, dev]
    paths:
      - "apps/glaux/**"
      - "pkgs/**"
      - "bun.lock"
      - "package.json"
      - "bunfig.toml"
      - ".github/workflows/build-glaux.yml"
  workflow_dispatch:
    inputs:
      stage:
        description: Image stage
        type: choice
        options: [prod, staging]
        default: prod

concurrency:
  group: aether-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: [self-hosted, linux, x64, fasberry]
    permissions:
      contents: read
    env:
      STAGE: ${{ github.event_name == 'workflow_dispatch' && inputs.stage || 'prod' }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: registry.fasberry.fun
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
          logout: false

      # The deploy host pulls :latest on a timer (ProjectFasberry/infra,
      # scripts/pull-update.sh), so pushing here is the whole rollout.
      - uses: docker/build-push-action@v6
        with:
          builder: fasberry
          context: .
          file: apps/glaux/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            STAGE=${{ env.STAGE }}
          tags: |
            registry.fasberry.fun/${{ env.STAGE }}/glaux:latest
            registry.fasberry.fun/${{ env.STAGE }}/glaux:sha-${{ github.sha }}
          cache-from: type=gha,scope=glaux
          cache-to: type=gha,mode=max,scope=glaux
