name: Build glaux

on:
  push:
    branches: [main, dev]
    paths:
      - "apps/glaux/**"
      - "pkgs/**"
      - "bun.lock"
      - "package.json"
      - "bunfig.toml"
      - ".github/workflows/build-glaux.yml"
  workflow_dispatch:
    inputs:
      stage:
        description: Image stage
        type: choice
        options: [prod, staging]
        default: prod

concurrency:
  group: aether-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: [self-hosted, linux, x64, fasberry]
    permissions:
      contents: read
    env:
      STAGE: ${{ github.event_name == 'workflow_dispatch' && inputs.stage || 'prod' }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: registry.fasberry.fun
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
          logout: false

      # Rollout is manual: publish the image, then run `fasberry deploy`
      # (or use Portainer) on the host.
      - uses: docker/build-push-action@v6
        with:
          builder: fasberry
          context: .
          file: apps/glaux/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            STAGE=${{ env.STAGE }}
          tags: |
            registry.fasberry.fun/${{ env.STAGE }}/glaux:latest
            registry.fasberry.fun/${{ env.STAGE }}/glaux:sha-${{ github.sha }}
          cache-from: type=gha,scope=glaux
          cache-to: type=gha,mode=max,scope=glaux
      - name: Notify glaux (Telegram + Gotify) about the pushed image
        continue-on-error: true
        env:
          ALERT_URL: ${{ vars.ALERT_URL || 'https://panel.fasberry.fun/internal/alerts' }}
          ALERT_KEY: ${{ secrets.ALERT_KEY }}
          IMAGE: ${{ vars.REGISTRY_HOST || 'registry.fasberry.fun' }}/${{ env.STAGE }}/glaux
        run: |
          [ -n "$ALERT_KEY" ] || { echo "ALERT_KEY is not set; skipping"; exit 0; }
          TITLE="image pushed: ${IMAGE}:latest"
          MESSAGE="commit ${GITHUB_SHA:0:8} | https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          payload=$(python3 -c 'import json,sys; print(json.dumps({"from":"ci","title":sys.argv[1],"message":sys.argv[2],"severity":"info"}))' "$TITLE" "$MESSAGE")
          curl -fsS -X POST "$ALERT_URL" \
            -H "Authorization: Bearer $ALERT_KEY" \
            -H "content-type: application/json" \
            --data "$payload"
